[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Mmu2filamentselect"
version = "1.0.8"
description = "This plugin shows a dialog to select the filament when a print on a Prusa printer with MMU2 is started in single mode."
authors = [
    { name = "Thomas Köckerbauer, previously Florian Schütte", email = "tkoecker@gmx.net" },
]
requires-python = ">=3.7,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
mmu2filamentselect = "octoprint_mmu2filamentselect"

[project.urls]
Homepage = "https://github.com/tkoecker/OctoPrint-Mmu2filamentselect"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_mmu2filamentselect",
    "octoprint_mmu2filamentselect.*",
]
